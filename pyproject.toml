[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "paleo-emu"
version = "0.1.2"
description = "paleo-emu: A Python package for flexible and reproducible emulation of the HadCM3 climate model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["paleo", "environment", "modeling"]
dependencies = [
  "cartopy",
  "h5netcdf",
  "joblib",
  "lightgbm",
  "matplotlib",
  "netCDF4",
  "numpy",
  "pandas",
  "Pillow",
  "pydantic",
  "PyYAML",
  "scikit-learn",
  "tensorflow",
  "xarray",
  "xgboost",
]

[project.optional-dependencies]
docs = [
  "pydata-sphinx-theme",
  "sphinx-gallery",
]

[project.urls]
Homepage = "https://github.com/paleo-emu-model/paleo-emu"
Repository = "https://github.com/paleo-emu-model/paleo-emu"

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE", "paleo_emu"]

[tool.hatch.build.targets.wheel]
packages = ["paleo_emu"]
