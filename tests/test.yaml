model_run_name: "test"
random_state: 29

cv:
  folds: 5
  n_jobs: -1
  scoring: neg_mean_squared_error

encoder_config:
  encoder_type: PCA
  n_components: 5
  pca_variance_ratio: 0.99

regressor_config:
  kernels:
    - RBF
  n_restarts_optimizer: 3
  whitekernel_noise_level: 1e-2
  whitekernel_noise_level_bounds: [1e-5, 1e1]
