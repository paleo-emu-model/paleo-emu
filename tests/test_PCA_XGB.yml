model_run_name: "test_PCA_XGB"
random_state: 29

training_file_path: "examples/training_data/"
X_input_file_name: "training_data_lowmodice_temp_formatted.res"
Y_input_file_name: "training_data_lowmodice_temp_formatted.nc"
X_column_names: ["co2", "obliquity", "esinw", "ecosw", "ice"]

cv:
  folds: 3        # CI fast: 3; recommended full training: 5
  n_jobs: -1
  scoring: neg_mean_squared_error

encoder_config:
  encoder_type: PCA
  n_components: 5
  pca_variance_ratio: 0.99

regressor_config:
  regressor_type: XGB
  max_depth: [6]                    # full training: [12, 16, 20]
  learning_rate: [0.1]              # full training: [0.03, 0.07, 0.1]
  n_estimators: [100]               # full training: [400, 800, 1600]
  subsample: [0.8]                  # full training: [0.8, 0.9]
  colsample_bytree: [0.8]           # full training: [0.8, 0.9]
  min_child_weight: [3.0]           # full training: [3, 5, 10]

forcing_data_path: "examples/forcing_data/"
forcing_data:
  800ka:
    kind: single
    forcing_input: "Paleo_forcings_800ka_xin.res"
