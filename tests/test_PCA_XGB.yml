model_run_name: "test_PCA_XGB"
random_state: 29

training_file_path: "examples/training_data/"
X_input_file_name: "training_data_lowmodice_temp_formatted.res"
Y_input_file_name: "training_data_lowmodice_temp_formatted.nc"
X_column_names: ["co2", "obliquity", "esinw", "ecosw", "ice"]

cv:
  folds: 5
  n_jobs: -1
  scoring: neg_mean_squared_error

encoder_config:
  encoder_type: PCA
  n_components: 5
  pca_variance_ratio: 0.99

regressor_config:
  regressor_type: XGB
  max_depth: [12, 16, 20]          # 更深树以提升拟合能力
  learning_rate: [0.03, 0.07, 0.1]     # 更小步长，配合更多树
  n_estimators: [400, 800, 1600]  # 增加迭代轮次
  subsample: [0.8, 0.9]           # 控制采样，抑制过拟合
  colsample_bytree: [0.8, 0.9]    # 特征采样
  min_child_weight: [3, 5, 10]        # 降低叶子最小权重，让树更容易生长

forcing_data_path: "examples/forcing_data/"
forcing_data:
  800ka:
    forcing_input: "Paleo_forcings_800ka_xin.res"